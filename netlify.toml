[build]
  publish = "public"

[[redirects]]
  from = "/api/*"
  to = "https://pollspace.onrender.com/api/:splat"
  status = 200
  force = true

# Static files — serve directly, never rewrite
[[redirects]]
  from = "/chatbot.js"
  to = "/chatbot.js"
  status = 200

[[redirects]]
  from = "/logo.png"
  to = "/logo.png"
  status = 200

# SPA catch-all — only for non-file routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
